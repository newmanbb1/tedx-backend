services:
  postgres:
    image: postgres:16-alpine
    container_name: tedx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tedx_user
      POSTGRES_PASSWORD: tedx_password_2026
      POSTGRES_DB: tedx_ticketing
    ports:
      - "5432:5432"
    volumes:
      - tedx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedx_user -d tedx_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tedx_pgdata:
